<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>文で覚える漢字 — Kanji in Sentences</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=JetBrains+Mono:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #08080a;
    --ink: #eef0f2;
    --ink-soft: #83858f;
    --green: #00e28a;
    --green-soft: rgba(0,226,138,0.09);
    --purple: #9d6bff;
    --purple-soft: rgba(157,107,255,0.12);
    --border: rgba(255,255,255,0.12);
    --card: rgba(20,20,24,0.65);
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { -webkit-text-size-adjust: 100%; }

  body {
    margin: 0;
    min-height: 100vh;
    min-height: 100dvh;
    background: var(--bg);
    background-image:
      radial-gradient(rgba(0,226,138,0.10) 1px, transparent 1px),
      radial-gradient(rgba(157,107,255,0.08) 1px, transparent 1px);
    background-size: 28px 28px, 28px 28px;
    background-position: 0 0, 14px 14px;
    color: var(--ink);
    font-family: 'JetBrains Mono', monospace;
    padding: 20px 14px 28px;
    padding-top: max(20px, env(safe-area-inset-top));
    padding-left: max(14px, env(safe-area-inset-left));
    padding-right: max(14px, env(safe-area-inset-right));
    padding-bottom: max(28px, env(safe-area-inset-bottom));
    overflow-x: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .wrap { width: 100%; max-width: 480px; }

  .top-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 14px;
  }

  .progress {
    font-size: 13px;
    font-weight: 700;
    color: var(--ink-soft);
  }
  .progress b { color: var(--green); }

  button.reshuffle {
    width: 40px;
    height: 40px;
    font-family: inherit;
    font-size: 17px;
    background: transparent;
    color: var(--green);
    border: 1.5px solid var(--green);
    border-radius: 10px;
    cursor: pointer;
    touch-action: manipulation;
    transition: transform .12s ease, background .12s ease, color .12s ease;
  }
  @media (hover: hover) and (pointer: fine) {
    button.reshuffle:hover { background: var(--green); color: #04140d; }
  }
  button.reshuffle:active { background: var(--green); color: #04140d; transform: scale(0.92); }
  button.reshuffle:focus-visible { outline: 2px solid var(--purple); outline-offset: 2px; }

  .card {
    background: var(--card);
    backdrop-filter: blur(16px);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 26px 20px 22px;
    position: relative;
    overflow: hidden;
    min-height: 300px;
    display: flex;
    flex-direction: column;
    touch-action: pan-y;
  }
  .card::before {
    content: "";
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: linear-gradient(90deg, var(--green), var(--purple));
  }

  .tags {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 16px;
  }
  .tag {
    font-family: 'Shippori Mincho', serif;
    font-size: 13px;
    font-weight: 700;
    color: var(--ink-soft);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 2px 7px;
  }

  .jp-text {
    font-family: 'Shippori Mincho', serif;
    font-size: clamp(22px, 6.5vw, 28px);
    line-height: 1.6;
    font-weight: 700;
    color: var(--ink);
    flex: 1;
  }

  .reveal-zone {
    margin-top: 18px;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 12px;
  }

  .reading-text {
    font-family: 'Shippori Mincho', serif;
    font-size: clamp(15px, 4.2vw, 18px);
    color: var(--green);
    line-height: 1.5;
  }

  .translation {
    display: flex;
    flex-direction: column;
    gap: 4px;
    padding-top: 10px;
    border-top: 1px dashed var(--border);
    width: 100%;
  }
  .tr-ru {
    font-size: 14px;
    color: var(--ink);
    font-weight: 600;
    line-height: 1.5;
  }
  .tr-uz {
    font-size: 12.5px;
    color: var(--purple);
    font-style: italic;
    line-height: 1.5;
  }

  .stamp-btn {
    font-family: inherit;
    font-weight: 700;
    font-size: 13px;
    background: transparent;
    color: var(--green);
    border: 1.5px solid var(--green);
    border-radius: 999px;
    padding: 11px 20px;
    cursor: pointer;
    touch-action: manipulation;
    transition: transform .12s ease, background .12s ease, color .12s ease;
  }
  @media (hover: hover) and (pointer: fine) {
    .stamp-btn:hover { background: var(--green); color: #04140d; }
  }
  .stamp-btn:active { background: var(--green); color: #04140d; transform: scale(0.95); }
  .stamp-btn:focus-visible { outline: 2px solid var(--purple); outline-offset: 2px; }

  .stamp-btn.alt { color: var(--purple); border-color: var(--purple); }
  @media (hover: hover) and (pointer: fine) {
    .stamp-btn.alt:hover { background: var(--purple); color: #0c0714; }
  }
  .stamp-btn.alt:active { background: var(--purple); color: #0c0714; }

  .nav-row {
    display: flex;
    gap: 10px;
    margin-top: 16px;
  }
  .nav-btn {
    flex: 1;
    font-family: inherit;
    font-weight: 700;
    font-size: 14px;
    background: rgba(255,255,255,0.03);
    color: var(--ink);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 13px 10px;
    cursor: pointer;
    touch-action: manipulation;
    min-height: 44px;
    transition: transform .12s ease, border-color .12s ease;
  }
  @media (hover: hover) and (pointer: fine) {
    .nav-btn:hover { border-color: var(--green); }
  }
  .nav-btn:active { transform: scale(0.97); border-color: var(--green); }
  .nav-btn:focus-visible { outline: 2px solid var(--purple); outline-offset: 2px; }

  .hint {
    text-align: center;
    font-size: 11px;
    color: var(--ink-soft);
    margin-top: 14px;
    opacity: 0.7;
  }

  @media (prefers-reduced-motion: no-preference) {
    .card { animation: fadein .25s ease-out; }
  }
  @keyframes fadein {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="top-row">
      <div class="progress"><b id="curNum">1</b> / <span id="totalNum">106</span></div>
      <button class="reshuffle" id="reshuffleBtn" aria-label="Перемешать">↻</button>
    </div>

    <div class="card" id="card">
      <div class="tags" id="tagsRow"></div>
      <div class="jp-text" id="jpText"></div>
      <div class="reveal-zone" id="revealZone"></div>
    </div>

    <div class="nav-row">
      <button class="nav-btn" id="prevBtn">← Пред.</button>
      <button class="nav-btn" id="nextBtn">Следующее →</button>
    </div>

    <div class="hint">Basic Kanji Book Vol.1 · 106 предложений · свайп или кнопки для навигации</div>
  </div>

let order = [];
let idx = 0;
let stage = 0; // 0: hidden, 1: reading shown, 2: translation shown

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function init() {
  order = shuffle([...Array(SENTENCES.length).keys()]);
  idx = 0;
  stage = 0;
  document.getElementById('totalNum').textContent = SENTENCES.length;
  render();
}

function render() {
  const s = SENTENCES[order[idx]];
  document.getElementById('curNum').textContent = idx + 1;
  document.getElementById('tagsRow').innerHTML = s.tags.map(t => '<span class="tag">' + t + '</span>').join('');
  document.getElementById('jpText').textContent = s.jp;

  const zone = document.getElementById('revealZone');
  if (stage === 0) {
    zone.innerHTML = '<button class="stamp-btn" id="showReading">Показать чтение</button>';
    document.getElementById('showReading').addEventListener('click', () => { stage = 1; render(); });
  } else if (stage === 1) {
    zone.innerHTML =
      '<div class="reading-text">' + s.reading + '</div>' +
      '<button class="stamp-btn alt" id="showTrans">Показать перевод</button>';
    document.getElementById('showTrans').addEventListener('click', () => { stage = 2; render(); });
  } else {
    zone.innerHTML =
      '<div class="reading-text">' + s.reading + '</div>' +
      '<div class="translation"><div class="tr-ru">' + s.ru + '</div>' +
      '<div class="tr-uz">' + s.uz + '</div></div>';
  }
}

function next() {
  idx = (idx + 1) % order.length;
  stage = 0;
  render();
}

function prev() {
  idx = (idx - 1 + order.length) % order.length;
  stage = 0;
  render();
}

document.getElementById('nextBtn').addEventListener('click', next);
document.getElementById('prevBtn').addEventListener('click', prev);
document.getElementById('reshuffleBtn').addEventListener('click', init);

document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowRight') next();
  else if (e.key === 'ArrowLeft') prev();
  else if (e.key === ' ') { e.preventDefault(); if (stage < 2) { stage++; render(); } else { next(); } }
});

// swipe support for touch
let touchStartX = null;
const cardEl = document.getElementById('card');
cardEl.addEventListener('touchstart', (e) => { touchStartX = e.changedTouches[0].clientX; }, { passive: true });
cardEl.addEventListener('touchend', (e) => {
  if (touchStartX === null) return;
  const dx = e.changedTouches[0].clientX - touchStartX;
  if (Math.abs(dx) > 50) {
    if (dx < 0) next(); else prev();
  }
  touchStartX = null;
}, { passive: true });

init();
</script>
