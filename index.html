  cardEl.style.setProperty('--drag-r',incomingFrom ? (incomingFrom>0?'-1deg':'1deg') : '0deg');
  cardEl.style.setProperty('--edge-x','0px');
  if(!flipped)return;
  if(c.type==='grammar'){
    $('back').innerHTML=`<div class="grammarBox"><div class="grammarLabel">ГРАММАТИКА</div><div class="grammarPattern">${esc(c.word)}</div><div class="grammarMeaning">${esc(c.ru||'')}</div><div class="rule"></div><div class="grammarLabel">ПРИМЕР</div><div class="grammarExample">${ruby(c.example,c.example_reading)}</div><div class="grammarTranslation">${esc(c.example_ru||'')}</div></div>`;
    return;
  }
  const parts=c.parts.map(p=>`<div class="part"><div class="pk">${esc(p.kanji)}</div><div class="pr">${esc(p.kun||'—')} · ${esc(p.on||'—')}</div><div class="pm">${esc(p.ru||'')}</div></div>`).join('');
  const ctx=shuffle([...c.context]).slice(0,6).map(x=>`<div class="ctx"><div class="ctxjp">${ruby(x.word,x.reading)}</div><div class="ctxtr">${esc(x.ru||'')} ${x.uz?`· ${esc(x.uz)}`:''}</div></div>`).join('');
  $('back').innerHTML=`<div class="word">${esc(c.word)}</div><div class="reading">${esc(c.reading||'')}</div><div class="translations"><div class="tr"><b>RU</b>${esc(c.ru||'—')}</div><div class="tr"><b>UZ</b>${esc(c.uz||'—')}</div></div><div class="rule"></div><div class="title">Кандзи в слове</div><div class="parts">${parts||'<span class="note">Отдельный разбор не указан</span>'}</div><div class="rule"></div><div class="title">Другие слова</div><div class="context">${ctx}</div>`;
}
function flip(){if(isDragging||isAnimating)return;flipped=!flipped;render()}
function next(){go(1)}
function prev(){go(-1)}
function go(dir){
  if(isAnimating)return;
  isAnimating=true;
  flipped=false;
  if(navigator.vibrate) navigator.vibrate(8);
  const width=Math.max(window.innerWidth||600,320);
  const out=dir>0?-width*1.08:width*1.08;
  cardEl.classList.remove('dragging','slide-in');
  cardEl.classList.add('slide-out');
  cardEl.style.setProperty('--drag-x',out+'px');
  cardEl.style.setProperty('--drag-r',(dir>0?-2.2:2.2)+'deg');
  cardEl.style.setProperty('--wave-x',dir>0?'12%':'88%');
  window.setTimeout(()=>{
    idx=(idx+dir+cards.length)%cards.length;
    render(-out);
    cardEl.classList.add('slide-in');
    // Start off-screen, then let the new card glide in. No reset/jump.
    requestAnimationFrame(()=>requestAnimationFrame(()=>{
      cardEl.style.setProperty('--drag-x','0px');
      cardEl.style.setProperty('--drag-r','0deg');
      cardEl.style.setProperty('--wave-x','50%');
      cardEl.classList.remove('slide-in');
    }));
    window.setTimeout(()=>{isAnimating=false},330);
  },230);
}

// Touch slider: use native touch events so iPhone/Android do not cancel a horizontal swipe.
let touchX=0,touchY=0,touchLastX=0,touchLastT=0,isDragging=false,isAnimating=false,touchActive=false,touchHorizontal=false,suppressClickUntil=0;
cardEl.addEventListener('touchstart',e=>{
  if(isAnimating)return;
  const t=e.touches[0];
  touchActive=true; touchHorizontal=false; isDragging=false;
  touchX=touchLastX=t.clientX; touchY=t.clientY; touchLastT=performance.now();
},{passive:true});
cardEl.addEventListener('touchmove',e=>{
  if(!touchActive||isAnimating)return;
  const t=e.touches[0],dx=t.clientX-touchX,dy=t.clientY-touchY;
  if(!touchHorizontal){
    if(Math.abs(dx)<3 && Math.abs(dy)<3)return;
    if(Math.abs(dx)<Math.abs(dy)*1.08){ touchActive=false; return; }
    touchHorizontal=true; isDragging=true; cardEl.classList.add('dragging');
  }
  e.preventDefault();
  const damp=dx*0.985;
  cardEl.style.setProperty('--drag-x',damp+'px');
  cardEl.style.setProperty('--drag-r',Math.max(-3.2,Math.min(3.2,damp/230))+'deg');
  cardEl.style.setProperty('--wave-x',(50+Math.max(-48,Math.min(48,dx/(window.innerWidth||600)*100)))+'%');
  cardEl.style.setProperty('--edge-x',Math.max(0,Math.min(window.innerWidth||600,50+dx))+'px');
  touchLastX=t.clientX; touchLastT=performance.now();
},{passive:false});
cardEl.addEventListener('touchend',e=>{
  if(!touchActive)return;
  const now=performance.now(),dx=touchLastX-touchX,dt=Math.max(1,now-touchLastT),velocity=(touchLastX-touchX)/Math.max(1,now-(touchLastT||now));
  touchActive=false;
  if(touchHorizontal){
    cardEl.classList.remove('dragging');
    const threshold=Math.max(16,Math.min(30,(window.innerWidth||600)*0.045));
    const fast=Math.abs(velocity)>0.42 || Math.abs(dx)>threshold;
    if(fast && Math.abs(dx)>Math.abs(touchY-(e.changedTouches[0]?.clientY||touchY))*0.9){
      suppressClickUntil=Date.now()+500;
      isDragging=false;
      go(dx<0?1:-1);
    }else{
      cardEl.style.setProperty('--drag-x','0px');cardEl.style.setProperty('--drag-r','0deg');cardEl.style.setProperty('--wave-x','50%');cardEl.style.setProperty('--edge-x','0px');
      isDragging=false;
    }
    return;
  }
  // Tap = flip. The delayed click from mobile browsers is suppressed.
  suppressClickUntil=Date.now()+450;
  flip();
},{passive:true});
cardEl.addEventListener('touchcancel',()=>{
  touchActive=false;isDragging=false;touchHorizontal=false;cardEl.classList.remove('dragging');
  cardEl.style.setProperty('--drag-x','0px');cardEl.style.setProperty('--drag-r','0deg');cardEl.style.setProperty('--wave-x','50%');cardEl.style.setProperty('--edge-x','0px');
},{passive:true});

// Mouse/trackpad: same page-like slider, without stealing normal clicks.
let mouseDown=false,mouseX=0,mouseY=0;
cardEl.addEventListener('mousedown',e=>{if(e.button!==0||isAnimating)return;mouseDown=true;mouseX=e.clientX;mouseY=e.clientY;isDragging=false});
window.addEventListener('mousemove',e=>{
  if(!mouseDown||isAnimating)return;
  const dx=e.clientX-mouseX,dy=e.clientY-mouseY;
  if(!isDragging && Math.abs(dx)>5 && Math.abs(dx)>Math.abs(dy)*1.08){isDragging=true;cardEl.classList.add('dragging')}
  if(!isDragging)return;
  const damp=dx*.985;cardEl.style.setProperty('--drag-x',damp+'px');cardEl.style.setProperty('--drag-r',Math.max(-3.2,Math.min(3.2,damp/230))+'deg');
});
window.addEventListener('mouseup',e=>{
  if(!mouseDown)return;mouseDown=false;
  if(isDragging){
    const dx=e.clientX-mouseX;cardEl.classList.remove('dragging');
    if(Math.abs(dx)>20){go(dx<0?1:-1)}else{cardEl.style.setProperty('--drag-x','0px');cardEl.style.setProperty('--drag-r','0deg')}
    isDragging=false;
  }
});
cardEl.addEventListener('click',e=>{
  if(Date.now()<suppressClickUntil)return;
  if(isDragging)return;
  // Mouse click flips; touch taps were already handled in touchend.
  if(e.pointerType!=='touch') flip();
});
cardEl.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();flip()}});
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'){e.preventDefault();next()}else if(e.key==='ArrowLeft'){e.preventDefault();prev()}else if(e.key===' '){e.preventDefault();flip()}});
render();</script></body></html>
