function relItem(word){

  const m=findMeta(clean)||{};
  const extra=REL_META[clean]||[];
  const reading=m.reading||embeddedReading||extra[0]||'';
  const ru=m.ru||extra[1]||'';
  return `<div class="relItem"><div>${ruby(clean,reading)}</div><div class="relRu">${esc(ru)}</div></div>`;
}
function relHtml(c){
  const r=c.relations;if(!r || ((!r.syn||!r.syn.length)&&(!r.ant||!r.ant.length))) return '';

}

}
